name: Refresh public activity

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/activity.yml'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'msk-ono/msk-ono'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Test the updater
        run: python3 -m unittest discover -s tests -v

      - name: Fetch public activity and generate the profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py

      - name: Commit generated activity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/activity-light.svg assets/activity-dark.svg assets/activity-mobile-light.svg assets/activity-mobile-dark.svg assets/activity.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh public activity'
          git push origin HEAD:main
